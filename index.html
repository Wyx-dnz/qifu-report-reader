<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>企服小蜜报告</title>
<style>
  :root{--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#ff6a00;--bg:#f7f5f2}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
  .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px 26px;box-shadow:0 18px 50px rgba(31,41,55,.08);text-align:center}
  .brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--brand);letter-spacing:.02em;margin-bottom:18px}
  .brand i{display:inline-flex;width:28px;height:28px;border-radius:9px;background:var(--brand);color:#fff;font-style:normal;align-items:center;justify-content:center;font-size:15px}
  .spinner{width:30px;height:30px;border:3px solid #ffe1cc;border-top-color:var(--brand);border-radius:50%;margin:8px auto 16px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:20px;line-height:1.35;margin:0 0 10px}
  p{font-size:14px;line-height:1.7;color:var(--muted);margin:0}
  .hint{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:#9ca3af}
  .error-mark{width:44px;height:44px;border-radius:50%;background:#fff3e8;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:24px;margin:4px auto 16px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card">
    <div class="brand"><i>蜜</i><span>企服小蜜</span></div>
    <div class="spinner"></div>
    <p>正在加载报告…</p>
    <div class="hint">报告链接 1 小时内有效</div>
  </div>
</div>
<script>
(function () {
  var SUPABASE = 'https://jywrcznlfwdyoptyxehb.supabase.co';
  var KEY = 'sb_publishable_fLvLsxthyeB3sUwuSxcntw_1xlTdzP9';
  var app = document.getElementById('app');
  var hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  var query = new URLSearchParams(location.search || '');
  var token = hash.get('t') || query.get('t') || '';
  var source = hash.get('u') || query.get('u') || '';

  function errorCard(title, desc) {
    app.innerHTML = '<div class="card">' +
      '<div class="brand"><i>蜜</i><span>企服小蜜</span></div>' +
      '<div class="error-mark">!</div>' +
      '<h1></h1><p></p>' +
      '<div class="hint">报告链接有效期为 1 小时，请在企服小蜜重新生成。</div>' +
      '</div>';
    app.querySelector('h1').textContent = title;
    app.querySelector('p').textContent = desc;
  }

  function renderHtml(html) {
    document.open();
    document.write(html);
    document.close();
  }

  // 新链路：报告 HTML 存在阿里云 OSS，阅读器直接拉取后渲染；手机不依赖 Supabase。
  if (source) {
    var sourceUrl;
    try { sourceUrl = new URL(source); } catch (e) { sourceUrl = null; }
    var hostOk = sourceUrl && /^xcampus-spaceworker\.oss-cn-[a-z0-9-]+\.aliyuncs\.com$/.test(sourceUrl.hostname);
    var pathOk = sourceUrl && sourceUrl.pathname.indexOf('/skill-files/xcampus-customer-profile-360-query/reports/') === 0;
    if (!sourceUrl || sourceUrl.protocol !== 'https:' || !hostOk || !pathOk) {
      errorCard('链接无效', '报告地址校验失败，请回企服小蜜重新生成。');
      return;
    }
    fetch(sourceUrl.href, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('http_' + res.status);
        return res.text();
      })
      .then(renderHtml)
      .catch(function () {
        errorCard('加载失败', '请检查网络后重试，或回企服小蜜重新生成。');
      });
    return;
  }

  if (!/^[A-Za-z0-9_-]{24,64}$/.test(token)) {
    errorCard('链接无效', '缺少报告 token，请回企服小蜜重新生成。');
    return;
  }

  fetch(SUPABASE + '/rest/v1/rpc/report_get', {
    method: 'POST',
    headers: { 'apikey': KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_token: token })
  })
    .then(function (res) { return res.json().then(function (json) { return { status: res.status, json: json }; }); })
    .then(function (result) {
      var json = result.json || {};
      if (result.status !== 200 || json.ok !== true || !json.html) {
        if (json.code === 'expired') errorCard('报告已过期', '这条报告链接已超过 1 小时。');
        else if (json.code === 'not_found') errorCard('报告不存在', '报告可能已清理，请回企服小蜜重新生成。');
        else errorCard('加载失败', '报告服务暂时不可用，请稍后重试。');
        return;
      }
      window.__QIFU_DOWNLOAD_URL__ = SUPABASE + '/functions/v1/qifu-report?t=' + encodeURIComponent(token) + '&download=1';
      renderHtml(json.html);
    })
    .catch(function () {
      errorCard('加载失败', '请检查网络后重试，或回企服小蜜重新生成。');
    });
})();
</script>
</body>
</html>
